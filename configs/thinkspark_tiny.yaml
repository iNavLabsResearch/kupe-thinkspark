# ThinkSpark — tiny dual-encoder backchannel predictor for Mac M1 (MPS/CPU).
# Every field maps 1:1 to thinkspark/config.py.

data:
  train_jsonl: data/splits/train.jsonl
  val_jsonl: data/splits/val.jsonl
  test_jsonl: data/splits/test.jsonl
  label_maps: data/vocab/label_maps.json
  max_input_len: 96        # bytes of the user utterance (primary signal)
  max_context_len: 384     # bytes of the PAST conversation transcript (multi-turn, multilingual)
  hf_repo: anuj-inavlabs/kupe-thinkspark
  hf_fetch: true           # download from HF if local splits are missing
  hf_refresh: false
  intent_scheme: super     # super = 9 clean agent-reactions (accuracy); fine = 17
                           # relabels at load — NO data regeneration

model:
  d_model: 192             # wider than the old 128 — byte models must build words
  n_heads: 6
  input_layers: 5          # deeper encoder for the primary input
  context_layers: 3        # multi-turn multilingual context needs capacity
  fusion_layers: 2         # input cross-attends into context
  ffn_mult: 3
  dropout: 0.1
  encoder_backend: byte    # byte = tiny, zero-OOV, lowest latency (recommended)
                           # hf   = pretrained IndicBERT/MuRIL/XLM-R (accuracy lever, higher latency)
  hf_model_name: ai4bharat/indic-bert

optim:
  epochs: 15               # early_stop still on — extra budget, not forced overfit
  batch_size: 64
  lr: 5.0e-4
  min_lr_ratio: 0.05
  weight_decay: 0.01
  warmup_ratio: 0.05
  grad_clip: 1.0
  w_intent: 1.0            # headline task
  w_lang: 0.5
  w_register: 0.3
  w_emotion: 0.5
  w_fillertype: 0.5
  label_smoothing: 0.05
  # --- imbalance handling: THE fix for flat macro-F1 (intent is 47:1 skewed) ---
  loss_intent: focal       # focal loss focuses gradient on hard/rare intents
  loss_emotion: ce
  loss_fillertype: ce
  loss_lang: ce
  loss_register: ce
  focal_gamma: 1.5
  class_balance_beta: 0.999 # effective-number class weights (Cui 2019); 0 disables
  balance_heads: [intent, emotion, filler_type]

run:
  device: auto             # auto -> cuda (Kaggle/Colab/PC) | mps (Mac) | cpu
  seed: 42
  num_workers: 0
  output_dir: artifacts/thinkspark
  log_every: 10
  eval_every_epochs: 1
  plot_every_epochs: 1
  keep_last_checkpoints: 3
  gpus: 0                  # 0 = use all CUDA GPUs (T4 x2 -> DDP automatically)
  distributed: auto        # auto | on | off
  amp: true                # mixed precision on CUDA
  term_plot: true          # live loss/F1 curves drawn in the terminal (Kaggle)
  early_stop: true         # stop when val macro-F1 plateaus (best ckpt kept)
  early_stop_patience: 4
  early_stop_min_delta: 0.002
